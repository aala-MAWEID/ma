name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    # لا يوقف أي شيء: النتيجة للعلم فقط
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: No committed Supabase secrets
        run: |
          ! grep -rEn "sb_(publishable|secret)_[A-Za-z0-9_-]{10,}|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9" src/ .env.example

      - name: CSS syntax audit (blocking)
        run: npm run audit:css

      - name: RTL audit (non blocking)
        run: npm run audit:rtl || true

      - name: Typecheck (non blocking)
        run: npm run typecheck || true

      - name: Tests (non blocking)
        run: npx vitest run --passWithNoTests || true

      - name: Build check
        run: npm run build:pages || true
        env:
          VITE_BASE_PATH: /ma/
          VITE_DATA_BACKEND: mock
          VITE_DEFAULT_TENANT: zaytouna
